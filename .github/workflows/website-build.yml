name: Build docs (website/)

# Builds the new Docusaurus site on every pull request that touches it.
# Broken links, broken anchors and broken redirects fail the build.
# Deployment is NOT handled here; see deploy.yml (old site) until cutover.

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-build.yml'
  workflow_dispatch:

concurrency:
  group: website-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for "Last updated" dates

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build (en)
        run: npm run build

      - name: Check redirects
        run: npm run check:redirects

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: website/build
          retention-days: 7
